<style>
  :root{

    --teal:#3E6D63;
    --clay:#B4623F;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;margin:0;padding:0;}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    min-height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 20px 64px;
  }
  main{width:100%;max-width:420px;}
  .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.6rem;
    line-height:1.05;
    letter-spacing:-0.01em;
  }
  .role{
    margin-top:10px;
    color:var(--line);
    font-size:1rem;
    line-height:1.5;
    max-width:34ch;
  }
  .loc{
    margin-top:18px;
    font-size:0.85rem;
    color:#8B8577;
  }
  nav{margin-top:40px;display:flex;flex-direction:column;gap:14px;}
  a.link{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    background:var(--paper);
    color:var(--ink);
    text-decoration:none;
    border-radius:2px;
    border-left:4px solid var(--teal);
    transition:transform .15s ease, border-color .15s ease;
  }
  a.link:hover{transform:translateX(4px);border-color:var(--clay);}
  a.link:focus-visible{outline:2px solid var(--clay);outline-offset:2px;}
  a.link .icon{
    width:22px;height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  a.link .icon svg{width:100%;height:100%;fill:var(--ink);}
  a.link .text{display:flex;flex-direction:column;}
  a.link .label{font-weight:500;font-size:1rem;}
  a.link .sub{font-size:0.78rem;color:#5B5344;}
  footer{margin-top:48px;font-size:0.75rem;color:#6E6858;text-align:center;}
</style>
